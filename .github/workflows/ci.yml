name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore InterviewApi.sln

      - name: Build
        run: dotnet build InterviewApi.sln -c Release --no-restore

      - name: Test
        run: dotnet test InterviewApi.Tests/InterviewApi.Tests.csproj -c Release --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build cities image
        run: docker build -f Dockerfile.cities -t cities-api:ci .

      - name: Build weather image
        run: docker build -f Dockerfile.weather -t weather-api:ci .
